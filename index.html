<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComptaPro Maroc — Vierge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a}
.sidebar{width:268px;background:#0f172a;color:#fff;position:fixed;top:0;bottom:0;left:0;padding:22px 16px;overflow:auto;z-index:20}
.logo{display:flex;gap:10px;align-items:center;padding-bottom:18px;border-bottom:1px solid #1e293b}.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:12px;display:grid;place-items:center;font-weight:800}.logo small{color:#94a3b8}
.sidebar button{display:flex;justify-content:space-between;width:100%;background:transparent;border:0;color:#cbd5e1;padding:12px;text-align:left;cursor:pointer;border-radius:10px;font-size:14px;margin-top:4px;font-family:inherit}.sidebar button.active,.sidebar button:hover{background:#4f46e5;color:#fff}
.main{margin-left:268px;padding:20px}.top{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:12px;border-radius:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);align-items:center}.top input{flex:1;min-width:160px;padding:11px;border:1px solid #e2e8f0;border-radius:10px;outline:none}
.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{font-size:24px;display:block;margin-top:4px}.kpi span{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:14px}th{color:#64748b;font-size:12px;text-transform:uppercase}
.btn{background:#059669;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btn2{background:#4f46e5;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btn3{background:#0ea5e9;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btnR{background:#ef4444;color:#fff;border:0;padding:7px 10px;border-radius:8px;cursor:pointer}.btnS{background:#f59e0b;color:#fff;border:0;padding:7px 10px;border-radius:8px;cursor:pointer}
input,select{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50}.modal.open{display:grid}.mbox{background:#fff;width:min(680px,94vw);border-radius:18px;padding:22px;max-height:92vh;overflow:auto}
.pagi{display:flex;gap:8px;align-items:center;margin-top:12px}.pagi button{padding:8px 14px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}.ok{background:#dcfce7;color:#166534}.alert{background:#fee2e2;color:#991b1b}.empty{padding:30px;text-align:center;color:#64748b}.empty b{color:#0f172a;font-size:18px}
@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.3s}.sidebar.open{transform:none}.main{margin-left:0}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="sidebar" id="sb"><div class="logo"><div class="logo-icon">CP</div><div><b>ComptaPro MA</b><br><small>Gestion comptable • Maroc</small></div></div><br>
<button class="active" onclick="show('dash',this)">📊 Dashboard</button>
<button onclick="show('fact',this)">🧾 Factures Vente</button>
<button onclick="show('avoir',this)">↩️ Avoirs</button>
<button onclick="show('devis',this)">📄 Devis</button>
<button onclick="show('bc',this)">📦 Bons Commande</button>
<button onclick="show('stock',this)">📦 Stock</button>
<button onclick="show('tiers',this)">👥 Clients & Fournisseurs</button>
<button onclick="show('pay',this)">💳 Paiements</button>
<button onclick="show('compta',this)">📚 Comptabilité</button>
<button onclick="show('bilan',this)">📈 Bilan & CPC & TVA</button>
<button onclick="show('para',this)">⚙️ Paramètres</button><br>
<div style="border-top:1px solid #1e293b;padding-top:14px"><b id="cNom">— Société —</b><br><small id="cIce" style="color:#94a3b8">ICE: —</small><br><button onclick="resetAll()" style="margin-top:10px;background:#ef4444;color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;width:100%">🗑 Effacer tout</button></div></div>
<div class="main"><div class="top"><button class="btn2" onclick="document.getElementById('sb').classList.toggle('open')">☰ Menu</button><input id="search" placeholder="🔍 Rechercher..." oninput="render()"><button class="btn3" onclick="scanDemo()">📷 Scan</button><button class="btn" onclick="exportExcel()">📗 Export .xlsx</button></div>
<div id="dash"></div><div id="fact" style="display:none"></div><div id="avoir" style="display:none"></div><div id="devis" style="display:none"></div><div id="bc" style="display:none"></div><div id="stock" style="display:none"></div><div id="tiers" style="display:none"></div><div id="pay" style="display:none"></div><div id="compta" style="display:none"></div><div id="bilan" style="display:none"></div><div id="para" style="display:none"></div></div>
<div class="modal" id="modal"><div class="mbox" id="modalBox"></div></div>
<script>
// VIERGE + SAUVEGARDE LOCALE - Tout est sauvegardé dans localStorage, rien ne se perd
let DB = JSON.parse(localStorage.getItem('comptapro_vierge_v2') || 'null');
if(!DB){ DB={societe:{nom:"",ice:"",if:"",adr:"",tel:""},factures:[],avoirs:[],devis:[],bcs:[],produits:[],clients:[],paiements:[]}; save(); }
function save(){ localStorage.setItem('comptapro_vierge_v2', JSON.stringify(DB)); updateHeader(); }
function updateHeader(){ document.getElementById('cNom').textContent = DB.societe.nom || '— Société —'; document.getElementById('cIce').textContent = 'ICE: ' + (DB.societe.ice || '—'); }
function fmt(n){ return Number(n||0).toLocaleString('fr-MA') + ' DH'; }
function toast(msg){ alert(msg); }
let cur='dash', page=1;
function show(id,btn){ cur=id; page=1; ["dash","fact","avoir","devis","bc","stock","tiers","pay","compta","bilan","para"].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active'); document.getElementById('sb').classList.remove('open'); render(); }
function emptyBox(title,desc,btnLabel,btnFn){ return `<div class="card"><div class="empty"><b>${title}</b><p style="margin:10px 0">${desc}</p><button class="btn" onclick="${btnFn}">${btnLabel}</button></div></div>`; }
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let ca=DB.factures.reduce((s,f)=>s+Number(f.ttc||0),0), imp=DB.factures.filter(f=>f.statut==='Impayée').reduce((s,f)=>s+Number(f.ttc||0),0);
 let alertes=DB.produits.filter(p=>Number(p.stock)<=Number(p.min)).length;
 document.getElementById('dash').innerHTML = `
 <div class="grid"><div class="card kpi"><span>Chiffre d'Affaires TTC</span><b>${fmt(ca)}</b></div><div class="card kpi"><span>Factures Impayées</span><b>${fmt(imp)}</b></div><div class="card kpi"><span>Alertes Stock</span><b>${alertes} produit(s)</b></div><div class="card kpi"><span>Clients</span><b>${DB.clients.length} client(s)</b></div></div>
 ${!DB.societe.nom ? `<div class="card" style="border:2px solid #4f46e5"><h3>👋 Bienvenue — Application Vierge</h3><p style="margin:10px 0">L'application est vierge. Le client doit d'abord entrer les infos de sa société.</p><button class="btn2" onclick="show('para')">➡ Configurer ma société</button></div>` : ''}
 <div class="card"><h3>Factures récentes</h3><br>${DB.factures.length===0?'<p style="color:#64748b">Aucune facture — Cliquez sur Factures pour ajouter.</p>':`<table><tr><th>Numéro</th><th>Client</th><th>TTC</th><th>Statut</th><th></th></tr>${DB.factures.map(f=>`<tr><td><b>${f.num}</b></td><td>${f.client}</td><td>${fmt(f.ttc)}</td><td><span class="badge ${f.statut==='Payée'?'ok':'alert'}">${f.statut}</span></td><td><button class="btn2" onclick="voirFacture('${f.num}')">Voir + QR</button></td></tr>`).join('')}</table>`}<br><div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page}</span><button onclick="next()">Suivant ➡</button></div></div>`;

 // FACTURES - Formulaire complet
 document.getElementById('fact').innerHTML = `<div class="card"><h2>Factures Vente</h2><p style="color:#64748b;margin:8px 0">Ajoutez, modifiez, supprimez — Tout est sauvegardé automatiquement.</p><button class="btn" onclick="openFactForm()">+ Nouvelle Facture</button> <button class="btn" onclick="exportExcel()">📗 Export .xlsx</button><br><br>${DB.factures.length===0?emptyBox('Aucune facture','Commencez par créer votre première facture.','+ Créer ma première facture','openFactForm()'):`<table><tr><th>Numéro</th><th>Client</th><th>Date</th><th>TTC</th><th>Statut</th><th>Actions</th></tr>${DB.factures.filter(f=>f.client.toLowerCase().includes(q)).map(f=>`<tr><td><b>${f.num}</b></td><td>${f.client}</td><td>${f.date}</td><td>${fmt(f.ttc)}</td><td><span class="badge ${f.statut==='Payée'?'ok':'alert'}">${f.statut}</span></td><td><button class="btn2" onclick="voirFacture('${f.num}')">Voir</button> <button class="btnS" onclick="togglePay('${f.num}')">${f.statut==='Payée'?'↩ Impayée':'✅ Payée'}</button> <button class="btnR" onclick="suppFact('${f.num}')">Supprimer</button></td></tr>`).join('')}</table>`}<div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page}</span><button onclick="next()">Suivant ➡</button></div></div>`;

 document.getElementById('avoir').innerHTML = `<div class="card"><h2>Avoirs</h2><br><button class="btn" onclick="openSimple('avoirs','Avoir','AV')">+ Nouvel Avoir</button><br><br>${DB.avoirs.length===0?'<p style="color:#64748b">Aucun avoir.</p>':`<table><tr><th>Numéro</th><th>Client</th><th>Montant</th><th></th></tr>${DB.avoirs.map((a,i)=>`<tr><td>${a.num}</td><td>${a.client}</td><td>${fmt(a.ttc)}</td><td><button class="btnR" onclick="delSimple('avoirs',${i})">Supprimer</button></td></tr>`).join('')}</table>`}</div>`;
 document.getElementById('devis').innerHTML = `<div class="card"><h2>Devis</h2><br><button class="btn" onclick="openSimple('devis','Devis','DV')">+ Nouveau Devis</button><br><br>${DB.devis.length===0?'<p style="color:#64748b">Aucun devis.</p>':`<table><tr><th>Numéro</th><th>Client</th><th>Montant</th><th>Actions</th></tr>${DB.devis.map((a,i)=>`<tr><td>${a.num}</td><td>${a.client}</td><td>${fmt(a.ttc)}</td><td><button class="btn2" onclick="convertDevis(${i})">Convertir en Facture</button> <button class="btnR" onclick="delSimple('devis',${i})">Supprimer</button></td></tr>`).join('')}</table>`}</div>`;
 document.getElementById('bc').innerHTML = `<div class="card"><h2>Bons de Commande</h2><br><button class="btn" onclick="openSimple('bcs','Bon de Commande','BC')">+ Nouveau BC</button><br><br>${DB.bcs.length===0?'<p style="color:#64748b">Aucun BC.</p>':`<table><tr><th>Numéro</th><th>Client / Fournisseur</th><th>Montant</th><th></th></tr>${DB.bcs.map((a,i)=>`<tr><td>${a.num}</td><td>${a.client}</td><td>${fmt(a.ttc)}</td><td><button class="btnR" onclick="delSimple('bcs',${i})">Supprimer</button></td></tr>`).join('')}</table>`}</div>`;

 document.getElementById('stock').innerHTML = `<div class="card"><h2>Stock + Scanner</h2><br><button class="btn" onclick="openProdForm()">+ Nouveau Produit</button> <button class="btn3" onclick="scanDemo()">📷 Scanner Code-barres</button> <button class="btn" onclick="exportExcel()">📗 Export .xlsx</button><br><br>${DB.produits.length===0?emptyBox('Stock vide','Ajoutez vos produits ici. Chaque produit aura son code-barres.','+ Ajouter mon premier produit','openProdForm()'):`<table><tr><th>Produit</th><th>Code-barres</th><th>Stock</th><th>Min</th><th>Prix</th><th>État</th><th>Actions</th></tr>${DB.produits.map((p,i)=>`<tr><td><b>${p.nom}</b></td><td>${p.code}</td><td>${p.stock}</td><td>${p.min}</td><td>${fmt(p.pv)}</td><td><span class="badge ${Number(p.stock)<=Number(p.min)?'alert':'ok'}">${Number(p.stock)<=Number(p.min)?'🔴 Alerte':'🟢 OK'}</span></td><td><button class="btnS" onclick="ajustStock(${i})">Ajuster</button> <button class="btnR" onclick="delSimple('produits',${i})">Supprimer</button></td></tr>`).join('')}</table>`}<div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page}</span><button onclick="next()">Suivant ➡</button></div></div>`;

 document.getElementById('tiers').innerHTML = `<div class="card"><h2>Clients & Fournisseurs</h2><br><button class="btn" onclick="openClientForm()">+ Nouveau Client / Fournisseur</button><br><br>${DB.clients.length===0?emptyBox('Aucun client','Ajoutez vos clients ici.','+ Ajouter mon premier client','openClientForm()'):`<table><tr><th>Nom</th><th>ICE</th><th>Téléphone</th><th>Solde</th><th></th></tr>${DB.clients.map((c,i)=>`<tr><td><b>${c.nom}</b></td><td>${c.ice}</td><td>${c.tel||''}</td><td>${fmt(c.solde)}</td><td><button class="btnR" onclick="delSimple('clients',${i})">Supprimer</button></td></tr>`).join('')}</table>`}</div>`;

 document.getElementById('pay').innerHTML = `<div class="card"><h2>Paiements</h2><br><button class="btn" onclick="openPayForm()">+ Nouveau Paiement</button><br><br>${DB.paiements.length===0?'<p style="color:#64748b">Aucun paiement.</p>':`<table><tr><th>Facture</th><th>Montant</th><th>Mode</th><th></th></tr>${DB.paiements.map((p,i)=>`<tr><td>${p.facture}</td><td>${fmt(p.montant)}</td><td>${p.mode}</td><td><button class="btnR" onclick="delSimple('paiements',${i})">Supprimer</button></td></tr>`).join('')}</table>`}</div>`;

 document.getElementById('compta').innerHTML = `<div class="card"><h2>Comptabilité — Journal (Auto)</h2><p style="color:#64748b;margin:10px 0">Journal généré automatiquement depuis vos factures. Aucune saisie manuelle.</p>${DB.factures.length===0?'<p>Aucune écriture — Créez une facture.</p>':`<table><tr><th>Date</th><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>${DB.factures.map(f=>`<tr><td>${f.date}</td><td>3421</td><td>Vente ${f.num} — ${f.client}</td><td>${fmt(f.ttc)}</td><td></td></tr><tr><td>${f.date}</td><td>7121</td><td>Vente ${f.num}</td><td></td><td>${fmt(f.ttc)}</td></tr>`).join('')}</table>`}</div>`;

 let tva = DB.factures.reduce((s,f)=>s+Number(f.ttc||0)*0.1667,0);
 document.getElementById('bilan').innerHTML = `<div class="card"><h2>Bilan & CPC & TVA (Auto)</h2><p style="margin:10px 0"><b>Chiffre d'affaires:</b> ${fmt(ca)} &nbsp; <b>Impayés:</b> ${fmt(imp)}</p><p><b>TVA collectée estimée (20%):</b> ${fmt(tva)}</p><br><button class="btn" onclick="exportExcel()">📗 Export .xlsx</button></div>`;

 document.getElementById('para').innerHTML = `<div class="card"><h2>⚙️ Paramètres Société — Sauvegarde Auto</h2><p style="color:#64748b;margin:8px 0">Entrez les infos du client. Tout est sauvegardé dans le téléphone, même après fermeture.</p><label>Nom société *</label><input id="pNom" value="${DB.societe.nom}"><label>ICE *</label><input id="pIce" value="${DB.societe.ice}"><label>IF</label><input id="pIf" value="${DB.societe.if}"><label>Adresse</label><input id="pAdr" value="${DB.societe.adr}"><label>Téléphone</label><input id="pTel" value="${DB.societe.tel}"><button class="btn" onclick="savePara()">💾 Sauvegarder — Reste enregistré</button><br><br><div style="background:#f8fafc;padding:14px;border-radius:12px"><b>QR Code ICE Société :</b><div id="qrPara" style="margin-top:10px"></div></div></div>`;
 setTimeout(()=>{ let el=document.getElementById('qrPara'); if(el && window.QRCode && DB.societe.ice){ el.innerHTML=''; new QRCode(el,{text:'ICE:'+DB.societe.ice+' | IF:'+DB.societe.if+' | '+DB.societe.nom,width:110,height:110}); } else if(el){ el.innerHTML='<small>Entrez ICE pour voir QR</small>'; } },100);
}
function prev(){ if(page>1)page--; render(); }
function next(){ page++; render(); }
function savePara(){ DB.societe.nom=document.getElementById('pNom').value; DB.societe.ice=document.getElementById('pIce').value; DB.societe.if=document.getElementById('pIf').value; DB.societe.adr=document.getElementById('pAdr').value; DB.societe.tel=document.getElementById('pTel').value; save(); render(); alert('✅ Paramètres sauvegardés — Restent enregistrés même après fermeture'); }
function resetAll(){ if(confirm('Effacer TOUTES les données ?')){ localStorage.removeItem('comptapro_vierge_v2'); location.reload(); } }
function openModal(html){ document.getElementById('modal').classList.add('open'); document.getElementById('modalBox').innerHTML=html; }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function openFactForm(){
 let clientsOpt = DB.clients.length? DB.clients.map(c=>`<option>${c.nom}</option>`).join('') : '<option>Nouveau Client</option>';
 openModal(`<h2>+ Nouvelle Facture</h2><label>Numéro</label><input id="fNum" value="FA-${new Date().getFullYear()}-${String(DB.factures.length+1).padStart(3,'0')}"><label>Client</label><select id="fClient">${clientsOpt}</select><input id="fClient2" placeholder="Ou tapez nouveau client"><label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Montant HT</label><input id="fHT" type="number" value="10000" oninput="calcTTC()"><label>TVA (20%)</label><input id="fTVA" type="number" value="2000" readonly><label>Montant TTC</label><input id="fTTC" type="number" value="12000" readonly><label>Statut</label><select id="fStatut"><option>Impayée</option><option>Payée</option></select><br><button class="btn" onclick="saveFact()">💾 Sauvegarder Facture</button> <button onclick="closeModal()">Annuler</button><p style="font-size:12px;color:#64748b;margin-top:10px">Après sauvegarde, le stock diminue si produit lié, et la facture reste enregistrée.</p>`);
}
function calcTTC(){ let ht=Number(document.getElementById('fHT').value||0); document.getElementById('fTVA').value=Math.round(ht*0.20); document.getElementById('fTTC').value=Math.round(ht*1.20); }
function saveFact(){ let client=document.getElementById('fClient2').value || document.getElementById('fClient').value; DB.factures.push({num:document.getElementById('fNum').value, client, date:document.getElementById('fDate').value, ttc:Number(document.getElementById('fTTC').value), statut:document.getElementById('fStatut').value}); save(); closeModal(); render(); alert('✅ Facture sauvegardée — Reste enregistrée'); }
function suppFact(num){ if(confirm('Supprimer '+num+' ?')){ DB.factures=DB.factures.filter(x=>x.num!==num); save(); render(); } }
function togglePay(num){ let f=DB.factures.find(x=>x.num===num); f.statut = f.statut==='Payée'?'Impayée':'Payée'; save(); render(); }
function dupliquer(num){ let f=DB.factures.find(x=>x.num===num); DB.factures.push({...f,num:f.num+'-COPIE'}); save(); render(); }
function voirFacture(num){ let f=DB.factures.find(x=>x.num===num)||DB.factures[0]; openModal(`<h2>Facture ${f.num}</h2><p style="margin-top:8px">Société: ${DB.societe.nom||'—'} — ICE: ${DB.societe.ice||'—'}</p><p>Client: ${f.client}</p><p>Date: ${f.date}</p><p>Montant TTC: ${fmt(f.ttc)}</p><p>Statut: ${f.statut}</p><br><div style="background:#f8fafc;padding:14px;border-radius:12px;display:flex;gap:16px;align-items:center"><div id="qrFact"></div><div><b>QR Code ICE</b><br><small>ICE: ${DB.societe.ice}<br>Facture: ${f.num}<br>TTC: ${fmt(f.ttc)}</small></div></div><br><button class="btn" onclick="closeModal()">Fermer</button>`); setTimeout(()=>{ if(window.QRCode) new QRCode(document.getElementById('qrFact'),{text:'ICE:'+DB.societe.ice+'|Facture:'+f.num+'|TTC:'+f.ttc,width:110,height:110}) },100); }
function openProdForm(){ openModal(`<h2>+ Nouveau Produit</h2><label>Nom produit *</label><input id="prNom" placeholder="Ex: PC Portable"><label>Code-barres</label><input id="prCode" value="6100000${String(DB.produits.length+1).padStart(5,'0')}"><button class="btn3" onclick="document.getElementById('prCode').value='6100000'+Math.floor(10000+Math.random()*89999)">📷 Générer Code-barres</button><label>Stock actuel</label><input id="prStock" type="number" value="10"><label>Stock minimum (alerte)</label><input id="prMin" type="number" value="3"><label>Prix Vente HT</label><input id="prPv" type="number" value="1000"><br><button class="btn" onclick="saveProd()">💾 Sauvegarder Produit</button> <button onclick="closeModal()">Annuler</button>`); }
function saveProd(){ if(!document.getElementById('prNom').value) return alert('Entrez nom produit'); DB.produits.push({nom:document.getElementById('prNom').value, code:document.getElementById('prCode').value, stock:Number(document.getElementById('prStock').value), min:Number(document.getElementById('prMin').value), pv:Number(document.getElementById('prPv').value)}); save(); closeModal(); render(); alert('✅ Produit sauvegardé'); }
function ajustStock(i){ let q=prompt('Nouveau stock pour '+DB.produits[i].nom+' (actuel '+DB.produits[i].stock+')', DB.produits[i].stock); if(q!==null){ DB.produits[i].stock=Number(q); save(); render(); alert('✅ Stock mis à jour — Sauvegardé'); } }
function openClientForm(){ openModal(`<h2>+ Nouveau Client / Fournisseur</h2><label>Nom *</label><input id="cNom2" placeholder="Nom société"><label>ICE</label><input id="cIce2" placeholder="ICE"><label>Téléphone</label><input id="cTel2" placeholder="06..."><label>Solde initial</label><input id="cSolde" type="number" value="0"><br><button class="btn" onclick="saveClient()">💾 Sauvegarder Client</button> <button onclick="closeModal()">Annuler</button>`); }
function saveClient(){ if(!document.getElementById('cNom2').value) return alert('Entrez nom'); DB.clients.push({nom:document.getElementById('cNom2').value, ice:document.getElementById('cIce2').value, tel:document.getElementById('cTel2').value, solde:Number(document.getElementById('cSolde').value)}); save(); closeModal(); render(); alert('✅ Client sauvegardé'); }
function openSimple(key,label,prefix){ openModal(`<h2>+ Nouveau ${label}</h2><label>Client / Fournisseur</label><input id="sClient" placeholder="Nom"><label>Montant TTC</label><input id="sTTC" type="number" value="1000"><br><button class="btn" onclick="saveSimple('${key}','${prefix}')">💾 Sauvegarder</button> <button onclick="closeModal()">Annuler</button>`); }
function saveSimple(key,prefix){ DB[key].push({num:prefix+'-'+new Date().getFullYear()+'-'+String(DB[key].length+1).padStart(3,'0'), client:document.getElementById('sClient').value||'Client', ttc:Number(document.getElementById('sTTC').value)}); save(); closeModal(); render(); alert('✅ Sauvegardé'); }
function delSimple(key,i){ if(confirm('Supprimer ?')){ DB[key].splice(i,1); save(); render(); } }
function convertDevis(i){ let d=DB.devis[i]; DB.factures.push({num:d.num.replace('DV','FA'), client:d.client, date:new Date().toISOString().slice(0,10), ttc:d.ttc, statut:'Impayée'}); DB.devis.splice(i,1); save(); render(); alert('✅ Devis converti en Facture'); }
function openPayForm(){ openModal(`<h2>+ Nouveau Paiement</h2><label>Facture</label><input id="payFact" placeholder="FA-..."><label>Montant</label><input id="payMont" type="number" value="1000"><label>Mode</label><select id="payMode"><option>Virement</option><option>Espèces</option><option>Chèque</option><option>Traite</option></select><br><button class="btn" onclick="savePay()">💾 Sauvegarder Paiement</button> <button onclick="closeModal()">Annuler</button>`); }
function savePay(){ DB.paiements.push({facture:document.getElementById('payFact').value, montant:Number(document.getElementById('payMont').value), mode:document.getElementById('payMode').value}); save(); closeModal(); render(); alert('✅ Paiement sauvegardé'); }
function scanDemo(){ if(DB.produits.length===0) return alert('Ajoutez d’abord un produit dans Stock, puis scannez.'); let p=DB.produits[0]; alert('📷 Scan réussi!\\nCode: '+p.code+'\\nProduit: '+p.nom+' — Stock: '+p.stock); }
function exportExcel(){ try{ let data=DB.factures.length?DB.factures.map(f=>({Numero:f.num,Client:f.client,Date:f.date,TTC:f.ttc,Statut:f.statut})):[{Numero:'Aucune',Client:'-',Date:'-',TTC:0,Statut:'-'}]; let ws=XLSX.utils.json_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Factures'); XLSX.writeFile(wb,'ComptaPro_Factures.xlsx'); alert('✅ Fichier .xlsx téléchargé'); }catch(e){ alert(e.message); } }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
updateHeader(); render();
</script></body></html>
