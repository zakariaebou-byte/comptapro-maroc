<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComptaPro Maroc — Comptabilité Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a}
.sidebar{width:268px;background:#0f172a;color:#fff;position:fixed;top:0;bottom:0;left:0;padding:22px 16px;overflow:auto;z-index:20}
.logo{display:flex;gap:10px;align-items:center;padding-bottom:18px;border-bottom:1px solid #1e293b}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:12px;display:grid;place-items:center;font-weight:800}
.logo small{color:#94a3b8}
.sidebar button{display:flex;justify-content:space-between;width:100%;background:transparent;border:0;color:#cbd5e1;padding:12px;text-align:left;cursor:pointer;border-radius:10px;font-size:14px;margin-top:4px;font-family:inherit}
.sidebar button.active,.sidebar button:hover{background:#4f46e5;color:#fff}
.main{margin-left:268px;padding:20px}
.top{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:12px;border-radius:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);align-items:center}
.top input{flex:1;min-width:180px;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;outline:none}
.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{font-size:24px;display:block;margin-top:4px}.kpi span{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:14px}th{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.btn{background:#059669;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btn2{background:#4f46e5;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btn3{background:#0ea5e9;color:#fff;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}
input,select{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50}.modal.open{display:grid}.mbox{background:#fff;width:min(650px,92vw);border-radius:18px;padding:22px;max-height:92vh;overflow:auto}
.pagi{display:flex;gap:8px;align-items:center;margin-top:12px}.pagi button{padding:8px 14px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}.ok{background:#dcfce7;color:#166534}.alert{background:#fee2e2;color:#991b1b}
@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.3s}.sidebar.open{transform:none}.main{margin-left:0}.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="sidebar" id="sb">
<div class="logo"><div class="logo-icon">CP</div><div><b>ComptaPro MA</b><br><small>Gestion comptable • Maroc</small></div></div><br>
<button class="active" onclick="show('dash',this)">📊 Dashboard</button>
<button onclick="show('fact',this)">🧾 Factures Vente</button>
<button onclick="show('avoir',this)">↩️ Avoirs</button>
<button onclick="show('devis',this)">📄 Devis</button>
<button onclick="show('bc',this)">📦 Bons Commande</button>
<button onclick="show('stock',this)">📦 Stock <span class="badge alert">1 alerte</span></button>
<button onclick="show('tiers',this)">👥 Clients & Fournisseurs</button>
<button onclick="show('pay',this)">💳 Paiements</button>
<button onclick="show('compta',this)">📚 Comptabilité</button>
<button onclick="show('bilan',this)">📈 Bilan & CPC & TVA</button>
<button onclick="show('para',this)">⚙️ Paramètres</button><br>
<div style="border-top:1px solid #1e293b;padding-top:14px"><b id="cNom">ComptaPro SARL</b><br><small id="cIce" style="color:#94a3b8">ICE: 001234567000089</small></div></div>
<div class="main">
<div class="top"><button class="btn2" onclick="document.getElementById('sb').classList.toggle('open')">☰ Menu</button><input id="search" placeholder="🔍 Rechercher facture, client, produit..." oninput="render()"><button class="btn3" onclick="scanDemo()">📷 Scan Code-barres</button><button class="btn" onclick="exportExcel()">📗 Export .xlsx</button></div>
<div id="dash"></div><div id="fact" style="display:none"></div><div id="avoir" style="display:none"></div><div id="devis" style="display:none"></div><div id="bc" style="display:none"></div><div id="stock" style="display:none"></div><div id="tiers" style="display:none"></div><div id="pay" style="display:none"></div><div id="compta" style="display:none"></div><div id="bilan" style="display:none"></div><div id="para" style="display:none"></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="modalBox"></div></div>
<script>
let DB={societe:{nom:"ComptaPro SARL",ice:"001234567000089",if:"12345678",adr:"Ben Slimane, Maroc",tel:"0612345678"},
factures:[{num:"FA-2024-001",client:"Client Maroc SARL",date:"2024-11-05",ttc:12000,statut:"Payée"},{num:"FA-2024-002",client:"Atlas Distribution",date:"2024-11-08",ttc:10200,statut:"Impayée"},{num:"FA-2024-003",client:"Sahara Market",date:"2024-11-09",ttc:8400,statut:"Impayée"}],
produits:[{code:"610000000001",nom:"PC Portable HP",stock:12,min:3,pv:5800},{code:"610000000002",nom:"Souris Logitech",stock:45,min:10,pv:180},{code:"610000000003",nom:"Imprimante Canon",stock:2,min:3,pv:1300},{code:"610000000004",nom:"Papier A4",stock:120,min:20,pv:55}],
clients:[{nom:"Client Maroc SARL",ice:"001111111000011",solde:12500},{nom:"Atlas Distribution",ice:"002222222000022",solde:8300},{nom:"Sahara Market",ice:"004444444000044",solde:5400}]};
let cur="dash",page=1;
function fmt(n){return Number(n).toLocaleString("fr-MA")+" DH"}
function show(id,btn){cur=id;page=1;["dash","fact","avoir","devis","bc","stock","tiers","pay","compta","bilan","para"].forEach(x=>document.getElementById(x).style.display="none");document.getElementById(id).style.display="block";document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");document.getElementById("sb").classList.remove("open");render();}
function render(){
 let q=(document.getElementById("search").value||"").toLowerCase();
 let ca=DB.factures.reduce((s,f)=>s+f.ttc,0), imp=DB.factures.filter(f=>f.statut==="Impayée").reduce((s,f)=>s+f.ttc,0);
 document.getElementById("dash").innerHTML=`<div class="grid"><div class="card kpi"><span>Chiffre d'Affaires TTC</span><b>${fmt(ca)}</b></div><div class="card kpi"><span>Factures Impayées</span><b>${fmt(imp)}</b></div><div class="card kpi"><span>Alertes Stock</span><b>1 produit</b></div><div class="card kpi"><span>Clients Actifs</span><b>${DB.clients.length} clients</b></div></div>
 <div class="card"><h3>Factures récentes</h3><br><table><tr><th>Numéro</th><th>Client</th><th>TTC</th><th>Statut</th><th></th></tr>${DB.factures.map(f=>`<tr><td><b>${f.num}</b></td><td>${f.client}</td><td>${fmt(f.ttc)}</td><td><span class="badge ${f.statut==="Payée"?"ok":"alert"}">${f.statut}</span></td><td><button class="btn2" onclick="voirFacture('${f.num}')">Voir + QR ICE</button></td></tr>`).join("")}</table><br><div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page} / 3</span><button onclick="next()">Suivant ➡</button></div></div>
 <div class="card"><h3>⚠️ Alertes Stock</h3><p style="margin-top:8px">Imprimante Canon — Stock 2 (Min 3) 🔴</p><br><button class="btn3" onclick="show('stock')">Voir Stock →</button></div>`;
 document.getElementById("fact").innerHTML=`<div class="card"><h2>Factures Vente</h2><br><button class="btn" onclick="addFacture()">+ Nouvelle Facture</button> <button class="btn" onclick="exportExcel()">📗 Export .xlsx</button><br><br><table><tr><th>Numéro</th><th>Client</th><th>Date</th><th>TTC</th><th>Statut</th><th>Actions</th></tr>${DB.factures.filter(f=>f.client.toLowerCase().includes(q)).map(f=>`<tr><td><b>${f.num}</b></td><td>${f.client}</td><td>${f.date}</td><td>${fmt(f.ttc)}</td><td><span class="badge ${f.statut==="Payée"?"ok":"alert"}">${f.statut}</span></td><td><button onclick="voirFacture('${f.num}')">Voir</button> <button onclick="dupliquer('${f.num}')">Dupliquer</button> <button onclick="supprimer('${f.num}')">Supprimer</button></td></tr>`).join("")}</table><div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page}</span><button onclick="next()">Suivant ➡</button></div></div>`;
 document.getElementById("avoir").innerHTML=`<div class="card"><h2>Avoirs</h2><p style="margin-top:10px">AV-2024-001 — Client Maroc SARL — 1.200 DH — Lié à FA-2024-001</p><br><button class="btn" onclick="alert('Nouvel avoir créé ✅')">+ Nouvel Avoir</button></div>`;
 document.getElementById("devis").innerHTML=`<div class="card"><h2>Devis</h2><p style="margin-top:10px">DV-2024-001 — Atlas — 8.500 DH — Accepté</p><br><button class="btn" onclick="alert('Devis converti en Facture ✅')">Convertir en Facture</button></div>`;
 document.getElementById("bc").innerHTML=`<div class="card"><h2>Bons de Commande</h2><p style="margin-top:10px">BC-2024-001 — Fournisseur — 15.000 DH</p><br><button class="btn" onclick="alert('BC converti en BL ✅')">Convertir en BL</button></div>`;
 document.getElementById("stock").innerHTML=`<div class="card"><h2>Stock + Scanner</h2><br><button class="btn3" onclick="scanDemo()">📷 Scanner Code-barres</button> <button class="btn" onclick="exportExcel()">📗 Export .xlsx</button><br><br><table><tr><th>Produit</th><th>Code-barres</th><th>Stock</th><th>Min</th><th>Prix</th><th>État</th></tr>${DB.produits.map(p=>`<tr><td><b>${p.nom}</b></td><td>${p.code}</td><td>${p.stock}</td><td>${p.min}</td><td>${fmt(p.pv)}</td><td><span class="badge ${p.stock<=p.min?"alert":"ok"}">${p.stock<=p.min?"🔴 Alerte":"🟢 OK"}</span></td></tr>`).join("")}</table><div class="pagi"><button onclick="prev()">⬅ Précédent</button><span>Page ${page}</span><button onclick="next()">Suivant ➡</button></div></div>`;
 document.getElementById("tiers").innerHTML=`<div class="card"><h2>Clients & Fournisseurs</h2><br><table><tr><th>Nom</th><th>ICE</th><th>Solde</th></tr>${DB.clients.map(c=>`<tr><td><b>${c.nom}</b></td><td>${c.ice}</td><td>${fmt(c.solde)}</td></tr>`).join("")}</table></div>`;
 document.getElementById("pay").innerHTML=`<div class="card"><h2>Paiements</h2><p style="margin-top:10px">PAI-001 — FA-2024-001 — 12.000 DH — Virement — Payé</p><br><button class="btn" onclick="alert('Paiement ajouté ✅')">+ Nouveau Paiement</button></div>`;
 document.getElementById("compta").innerHTML=`<div class="card"><h2>Comptabilité — Journal</h2><br><table><tr><th>Date</th><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr><tr><td>05/11</td><td>3421</td><td>Vente FA-001</td><td>12.000 DH</td><td></td></tr><tr><td>05/11</td><td>7121</td><td>Vente</td><td></td><td>12.000 DH</td></tr></table></div>`;
 document.getElementById("bilan").innerHTML=`<div class="card"><h2>Bilan & CPC & TVA</h2><p style="margin-top:10px"><b>Actif:</b> 45.000 DH &nbsp; <b>Passif:</b> 45.000 DH</p><p><b>TVA Collectée:</b> 6.100 DH &nbsp; <b>TVA à payer:</b> 4.200 DH</p><br><button class="btn" onclick="exportExcel()">📗 Export .xlsx</button></div>`;
 document.getElementById("para").innerHTML=`<div class="card"><h2>⚙️ Paramètres Société</h2><br><label>Nom société</label><input id="pNom" value="${DB.societe.nom}"><label>ICE</label><input id="pIce" value="${DB.societe.ice}"><label>IF</label><input id="pIf" value="${DB.societe.if}"><label>Adresse</label><input id="pAdr" value="${DB.societe.adr}"><label>Téléphone</label><input id="pTel" value="${DB.societe.tel}"><button class="btn" onclick="savePara()">💾 Sauvegarder</button><br><br><div style="background:#f8fafc;padding:14px;border-radius:12px"><b>QR Code ICE Société :</b><div id="qrPara" style="margin-top:10px"></div></div></div>`;
 setTimeout(()=>{let el=document.getElementById("qrPara"); if(el && window.QRCode){el.innerHTML=""; new QRCode(el,{text:"ICE:"+DB.societe.ice+" | IF:"+DB.societe.if+" | "+DB.societe.nom,width:110,height:110});}},100);
}
function prev(){if(page>1)page--;render();}
function next(){page++;if(page>3)page=3;render();}
function savePara(){DB.societe.nom=document.getElementById("pNom").value;DB.societe.ice=document.getElementById("pIce").value;DB.societe.if=document.getElementById("pIf").value;DB.societe.adr=document.getElementById("pAdr").value;DB.societe.tel=document.getElementById("pTel").value;document.getElementById("cNom").textContent=DB.societe.nom;document.getElementById("cIce").textContent="ICE: "+DB.societe.ice;alert("✅ Paramètres sauvegardés");render();}
function addFacture(){let n="FA-2024-00"+(DB.factures.length+1);DB.factures.push({num:n,client:"Nouveau Client",date:"2024-11-10",ttc:5000,statut:"Impayée"});render();alert("✅ Facture "+n+" créée");}
function dupliquer(num){let f=DB.factures.find(x=>x.num===num);DB.factures.push({...f,num:f.num+"-COPIE"});render();alert("✅ Dupliquée");}
function supprimer(num){if(confirm("Supprimer "+num+" ?")){DB.factures=DB.factures.filter(x=>x.num!==num);render();}}
function voirFacture(num){let f=DB.factures.find(x=>x.num===num)||DB.factures[0];document.getElementById("modal").classList.add("open");document.getElementById("modalBox").innerHTML=`<h2>Facture ${f.num}</h2><p style="margin-top:8px">Société: ${DB.societe.nom} — ICE: ${DB.societe.ice}</p><p>Client: ${f.client}</p><p>Montant TTC: ${fmt(f.ttc)}</p><br><div style="background:#f8fafc;padding:14px;border-radius:12px;display:flex;gap:16px;align-items:center"><div id="qrFact"></div><div><b>QR Code ICE</b><br><small>Scannez pour vérifier<br>ICE: ${DB.societe.ice}<br>Facture: ${f.num}<br>TTC: ${fmt(f.ttc)}</small></div></div><br><button class="btn" onclick="closeModal()">Fermer</button>`; setTimeout(()=>{new QRCode(document.getElementById("qrFact"),{text:"ICE:"+DB.societe.ice+"|Facture:"+f.num+"|TTC:"+f.ttc,width:110,height:110})},100);}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function scanDemo(){let code="61000000000"+Math.floor(Math.random()*9);let p=DB.produits[0];alert("📷 Scan réussi!\\nCode: "+code+"\\nProduit: "+p.nom+" — Stock: "+p.stock);render();}
function exportExcel(){try{let data=DB.factures.map(f=>({Numero:f.num,Client:f.client,Date:f.date,TTC:f.ttc,Statut:f.statut,ICE_Client:"001111111000011"}));let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Factures");XLSX.writeFile(wb,"ComptaPro_Factures.xlsx");alert("✅ Fichier .xlsx téléchargé");}catch(e){alert("Export: "+e.message)}}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
